version: "2"
sql:
  - engine: "postgresql"
    queries: "query"
    schema: "./migrations"
    gen:
      go:
        package: "db"
        out: "../repository/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"

          - column: "price_history.product_id"
            go_type: "int64"

          - column: "products.brand"
            go_type: "string"